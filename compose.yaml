services:
  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: talya_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: talya_db
      MYSQL_USER: talya_user
      MYSQL_PASSWORD: talya_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - talya_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talya_app
    platform: linux/arm64/v8
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    platform: linux/arm64/v8
    container_name: talya_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_pass
      UPLOAD_LIMIT: 256M

volumes:
  talya_db_data:
