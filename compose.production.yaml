services:
  db:
    image: mysql:8.0
    container_name: talya_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-talya_db}
      MYSQL_USER: ${DB_USERNAME:-talya_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talya_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - talya_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talya_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html

volumes:
  talya_db_data:
